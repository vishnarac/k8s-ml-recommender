apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-resource-recommender
  namespace: resource-recommender
  labels:
    app: k8s-resource-recommender
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-resource-recommender
  template:
    metadata:
      labels:
        app: k8s-resource-recommender
    spec:
      serviceAccountName: k8s-resource-recommender
      containers:
      - name: resource-recommender
        image: k8s-resource-recommender:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 9091
          name: metrics
        env:
        - name: CONFIG_PATH
          value: "/app/config.yaml"
        - name: PYTHONPATH
          value: "/app"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: data
          mountPath: /data
        - name: logs
          mountPath: /var/log
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: resource-recommender-config
      - name: data
        persistentVolumeClaim:
          claimName: resource-recommender-data
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-resource-recommender
  namespace: resource-recommender
  labels:
    app: k8s-resource-recommender
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 9091
    targetPort: 9091
    protocol: TCP
    name: metrics
  selector:
    app: k8s-resource-recommender
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resource-recommender-data
  namespace: resource-recommender
  labels:
    app: k8s-resource-recommender
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi 