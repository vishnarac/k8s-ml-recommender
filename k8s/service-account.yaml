apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-resource-recommender
  namespace: resource-recommender
  labels:
    app: k8s-resource-recommender
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: resource-recommender
  labels:
    app: k8s-resource-recommender
rules:
- apiGroups: [""]
  resources: ["pods", "services", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: resource-recommender
  labels:
    app: k8s-resource-recommender
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: resource-recommender
subjects:
- kind: ServiceAccount
  name: k8s-resource-recommender
  namespace: resource-recommender 