apiVersion: v1
kind: ConfigMap
metadata:
  name: resource-recommender-config
  namespace: resource-recommender
  labels:
    app: k8s-resource-recommender
data:
  config.yaml: |
    # Prometheus Configuration
    prometheus:
      url: "http://prometheus:9090"
      timeout: 30
      retry_attempts: 3
      metrics:
        cpu_usage: "container_cpu_usage_seconds_total"
        memory_usage: "container_memory_usage_bytes"
        cpu_requests: "kube_pod_container_resource_requests_cpu_cores"
        memory_requests: "kube_pod_container_resource_requests_memory_bytes"
        cpu_limits: "kube_pod_container_resource_limits_cpu_cores"
        memory_limits: "kube_pod_container_resource_limits_memory_bytes"
        pod_restarts: "kube_pod_container_status_restarts_total"

    # Kubernetes Configuration
    kubernetes:
      config_path: "/var/run/secrets/kubernetes.io/serviceaccount"
      context: null
      namespace: "default"
      api_timeout: 30

    # Model Configuration
    model:
      type: "regression"
      architecture:
        layers: [128, 64, 32]
        dropout: 0.2
        activation: "relu"
        output_activation: "linear"
      
      training:
        epochs: 100
        batch_size: 32
        validation_split: 0.2
        early_stopping_patience: 10
        learning_rate: 0.001
        
      features:
        - "cpu_usage_p95"
        - "cpu_usage_p99"
        - "memory_usage_p95"
        - "memory_usage_p99"
        - "pod_restarts"
        - "current_cpu_requests"
        - "current_memory_requests"
        - "current_cpu_limits"
        - "current_memory_limits"
        - "deployment_replicas"
        - "pod_age_hours"

    # Data Collection
    data:
      collection_period_days: 30
      scrape_interval_minutes: 5
      retention_days: 90
      min_data_points: 100
      
      preprocessing:
        outlier_threshold: 3.0
        smoothing_window: 5
        fill_missing: "interpolate"

    # API Configuration
    api:
      host: "0.0.0.0"
      port: 8000
      workers: 4
      timeout: 30
      rate_limit: 100
      
      authentication:
        enabled: false
        type: "bearer"
        secret_key: "your-secret-key-here"

    # Recommendations
    recommendations:
      safety_margin_cpu: 1.2
      safety_margin_memory: 1.3
      min_cpu_request: 10
      min_memory_request: 64
      max_cpu_limit_multiplier: 4.0
      max_memory_limit_multiplier: 3.0
      
      confidence_threshold: 0.8
      min_recommendation_confidence: 0.7

    # Logging
    logging:
      level: "INFO"
      format: "json"
      file: "/var/log/app.log"
      max_size: "100MB"
      backup_count: 5

    # Monitoring
    monitoring:
      enabled: true
      metrics_port: 9091
      health_check_interval: 30
      
      prometheus:
        enabled: true
        path: "/metrics"
        
      custom_metrics:
        - "recommendations_total"
        - "recommendation_accuracy"
        - "training_duration_seconds"
        - "inference_latency_seconds"

    # Storage
    storage:
      type: "local"
      path: "/data"
      
      models:
        path: "/data/models"
        format: "saved_model"
        
      datasets:
        path: "/data/datasets"
        format: "parquet"

    # Cost Optimization
    cost_optimization:
      enabled: true
      cloud_provider: "aws"
      
      pricing:
        cpu_per_core_hour: 0.024
        memory_per_gib_hour: 0.003
        
      savings_threshold: 0.1

    # Security
    security:
      rbac:
        enabled: true
        service_account: "k8s-resource-recommender"
        cluster_role: "resource-recommender"
        
      network:
        allowed_origins: ["*"]
        cors_enabled: true
        
      secrets:
        mount_path: "/secrets"
        prometheus_token_path: "/secrets/prometheus-token" 