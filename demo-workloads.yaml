apiVersion: v1
kind: Namespace
metadata:
  name: demo-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: demo-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: web-app
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        command: ["/bin/sh"]
        args:
        - -c
        - |
          # Simulate CPU and memory usage
          while true; do
            # CPU intensive task
            for i in {1..1000}; do
              echo "Processing request $i" > /dev/null
            done
            # Memory usage
            dd if=/dev/zero of=/tmp/test bs=1M count=50 2>/dev/null
            sleep 5
          done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: demo-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
      - name: api-server
        image: python:3.9-alpine
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "300m"
            memory: "256Mi"
          limits:
            cpu: "600m"
            memory: "512Mi"
        command: ["python"]
        args:
        - -c
        - |
          import time
          import random
          import os
          
          # Simulate API server with variable load
          while True:
            # Simulate CPU usage based on time
            cpu_load = 50 + 30 * (time.time() % 60) / 60
            for _ in range(int(cpu_load * 100)):
              _ = random.random() ** 2
            
            # Simulate memory usage
            memory_usage = 100 + 50 * random.random()
            data = "x" * int(memory_usage * 1024 * 1024)
            
            time.sleep(2)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: demo-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
      - name: database
        image: postgres:13-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          value: "demo123"
        resources:
          requests:
            cpu: "800m"
            memory: "1Gi"
          limits:
            cpu: "1500m"
            memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: web-app-service
  namespace: demo-apps
spec:
  selector:
    app: web-app
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: api-server-service
  namespace: demo-apps
spec:
  selector:
    app: api-server
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: database-service
  namespace: demo-apps
spec:
  selector:
    app: database
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP 