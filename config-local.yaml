# Local Kubernetes Configuration for k8s-ml-recommender

# Prometheus Configuration (disabled for local demo)
prometheus:
  url: "http://localhost:9090"  # Not used in local demo
  timeout: 30
  retry_attempts: 3
  enabled: false  # Disable Prometheus for local demo
  metrics:
    cpu_usage: "container_cpu_usage_seconds_total"
    memory_usage: "container_memory_usage_bytes"
    cpu_requests: "kube_pod_container_resource_requests_cpu_cores"
    memory_requests: "kube_pod_container_resource_requests_memory_bytes"
    cpu_limits: "kube_pod_container_resource_limits_cpu_cores"
    memory_limits: "kube_pod_container_resource_limits_memory_bytes"
    pod_restarts: "kube_pod_container_status_restarts_total"

# Kubernetes Configuration
kubernetes:
  config_path: "~/.kube/config"
  context: null  # Use current context
  namespace: "demo-apps"  # Use our demo namespace
  api_timeout: 30

# Model Configuration
model:
  type: "regression"
  architecture:
    layers: [64, 32, 16]
    dropout: 0.2
    activation: "relu"
    output_activation: "linear"
  
  training:
    epochs: 50
    batch_size: 16
    validation_split: 0.2
    early_stopping_patience: 5
    learning_rate: 0.001
    
  features:
    - "cpu_usage_p95"
    - "cpu_usage_p99"
    - "memory_usage_p95"
    - "memory_usage_p99"
    - "pod_restarts"
    - "current_cpu_requests"
    - "current_memory_requests"
    - "current_cpu_limits"
    - "current_memory_limits"
    - "deployment_replicas"
    - "pod_age_hours"

# Data Collection
data:
  collection_period_days: 1  # Shorter period for demo
  scrape_interval_minutes: 1  # More frequent for demo
  retention_days: 7
  min_data_points: 10  # Lower threshold for demo
  
  preprocessing:
    outlier_threshold: 3.0
    smoothing_window: 3
    fill_missing: "interpolate"

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  workers: 1  # Single worker for local demo
  timeout: 30
  rate_limit: 100
  
  authentication:
    enabled: false

# Recommendations
recommendations:
  safety_margin_cpu: 1.2
  safety_margin_memory: 1.3
  min_cpu_request: 10
  min_memory_request: 32
  max_cpu_limit_multiplier: 4.0
  max_memory_limit_multiplier: 3.0
  
  confidence_threshold: 0.7
  min_recommendation_confidence: 0.6

# Logging
logging:
  level: "INFO"
  format: "json"
  file: "logs/app.log"
  max_size: "100MB"
  backup_count: 5

# Monitoring
monitoring:
  enabled: true
  metrics_port: 9091
  health_check_interval: 30
  
  prometheus:
    enabled: false  # Disable for local demo
    
  custom_metrics:
    - "recommendations_total"
    - "recommendation_accuracy"
    - "training_duration_seconds"
    - "inference_latency_seconds"

# Storage
storage:
  type: "local"
  path: "./data"
  
  models:
    path: "./models"
    format: "saved_model"
    
  datasets:
    path: "./data/datasets"
    format: "parquet"

# Cost Optimization
cost_optimization:
  enabled: true
  cloud_provider: "aws"
  
  pricing:
    cpu_per_core_hour: 0.024
    memory_per_gib_hour: 0.003
    
  savings_threshold: 0.05  # 5% minimum savings

# Security
security:
  rbac:
    enabled: false  # Disable for local demo
    service_account: "k8s-resource-recommender"
    cluster_role: "resource-recommender"
    
  network:
    allowed_origins: ["*"]
    cors_enabled: true
    
  secrets:
    mount_path: "/secrets"
    prometheus_token_path: "/secrets/prometheus-token"
